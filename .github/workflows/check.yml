name: Check configuration and deployment artifact
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y age bubblewrap
          sudo tee /etc/apparmor.d/enderpin-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile enderpin-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/enderpin-bwrap
          python3 -m venv .venv
          .venv/bin/pip install -r deploy/ansible/requirements.txt
          .venv/bin/python -B deploy/test_deploy.py
          .venv/bin/python -B deploy/test_migrate.py
      - name: Check deployment syntax
        working-directory: deploy/ansible
        run: ../../.venv/bin/ansible-playbook -i ../inventory.example.yml deploy.yml --syntax-check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Rebuild and test the Floodgate-aware Discord plugin
        run: .venv/bin/python scripts/build-discord-plugin.py --check
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aomona/enderpin
          ref: fa760a92e995e31251f9fb2953a78671fe33cccc # v0.2.0
          path: .local/enderpin-source
          persist-credentials: false
      - name: Build Enderpin with the NetherNet interface discovery fix
        run: |
          git -C .local/enderpin-source apply --check ../../deploy/patches/enderpin-netlink-route.patch
          git -C .local/enderpin-source apply ../../deploy/patches/enderpin-netlink-route.patch
          cargo build --release --locked --manifest-path .local/enderpin-source/Cargo.toml
          cargo test --locked --manifest-path .local/enderpin-source/Cargo.toml --lib
          cargo test --locked --manifest-path .local/enderpin-source/Cargo.toml --lib route_netlink_interface_discovery -- --ignored --nocapture
          cp .local/enderpin-source/target/release/enderpin .local/enderpin
          cd .local
          sha256sum enderpin > enderpin.sha256
          chmod 700 enderpin
          ./enderpin --version
      - name: Verify all locked server workspaces on Linux
        run: |
          .local/enderpin sync --target proxy --locked
          .local/enderpin sync --target survival --locked
          .local/enderpin sync --target creative --locked
      - name: Verify the locked Prism client profile on Linux
        run: ./enderpinw sync --target client --locked
      - name: Test and build the client modpack
        run: |
          python3 -B scripts/test_mrpack.py
          python3 -B scripts/build-mrpack.py --version "client-${GITHUB_SHA}" --output .local/mrpack/spnya-client.mrpack
          cd .local/mrpack
          sha256sum spnya-client.mrpack > spnya-client.mrpack.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-mrpack
          path: .local/mrpack/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enderpin-linux-x86_64
          path: |
            .local/enderpin
            .local/enderpin.sha256
          include-hidden-files: true
          if-no-files-found: error
  build-arm:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aomona/enderpin
          ref: fa760a92e995e31251f9fb2953a78671fe33cccc # v0.2.0
          path: .local/enderpin-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test the ARM Enderpin binary
        run: |
          git -C .local/enderpin-source apply --check ../../deploy/patches/enderpin-netlink-route.patch
          git -C .local/enderpin-source apply ../../deploy/patches/enderpin-netlink-route.patch
          cargo build --release --locked --manifest-path .local/enderpin-source/Cargo.toml
          cargo test --locked --manifest-path .local/enderpin-source/Cargo.toml --lib
          cp .local/enderpin-source/target/release/enderpin .local/enderpin
          cd .local
          sha256sum enderpin > enderpin.sha256
          chmod 700 enderpin
          ./enderpin --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enderpin-linux-arm64
          path: |
            .local/enderpin
            .local/enderpin.sha256
          include-hidden-files: true
          if-no-files-found: error
