name: Check configuration and deployment artifact
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y age
          python3 -m venv .venv
          .venv/bin/pip install -r deploy/ansible/requirements.txt
          .venv/bin/python -B deploy/test_deploy.py
      - name: Check deployment syntax
        working-directory: deploy/ansible
        run: ../../.venv/bin/ansible-playbook -i ../inventory.example.yml deploy.yml --syntax-check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify Enderpin 0.1.6 for Linux x86_64
        run: |
          mkdir -p .local
          curl --fail --location --retry 3 -o .local/enderpin.tgz \
            https://github.com/aomona/enderpin/releases/download/v0.1.6/enderpin-linux-x64.tgz
          echo 'f5a3a89ae615b999a479540fa87bd0c0ef94335a2769ecb5847962812f9f8b00  .local/enderpin.tgz' | sha256sum -c -
          tar -xzf .local/enderpin.tgz -C .local --strip-components=2 package/bin/enderpin
          cd .local
          echo '3fbbbd3aed275b08c03b704d11571ff1291be450cc9dd65b8c69e9c74335ad90  enderpin' > enderpin.sha256
          sha256sum -c enderpin.sha256
          chmod 700 enderpin
          ./enderpin --version
      - name: Verify both locked server workspaces on Linux
        run: |
          .local/enderpin -C servers/proxy sync --target server --locked
          .local/enderpin -C servers/survival sync --target server --locked
      - name: Verify the locked Prism client profile on Linux
        working-directory: client
        run: ./enderpinw sync --target client --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enderpin-linux-x86_64
          path: |
            .local/enderpin
            .local/enderpin.sha256
          include-hidden-files: true
          if-no-files-found: error
