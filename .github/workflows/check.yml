name: Check configuration and build deploy tool
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r deploy/ansible/requirements.txt
          .venv/bin/python -B deploy/test_deploy.py
      - name: Check deployment syntax
        working-directory: deploy/ansible
        run: ../../.venv/bin/ansible-playbook -i ../inventory.example.yml deploy.yml --syntax-check
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aomona/enderpin
          ref: 9595d767a12b9659cdc982234e53dd53c2a024ca
          path: .local/enderpin-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build pinned Enderpin for Linux x86_64
        working-directory: .local/enderpin-source
        run: |
          cargo build --release --locked --bin enderpin
          cp target/release/enderpin ../enderpin
          cd ..
          sha256sum enderpin > enderpin.sha256
      - name: Verify both locked server workspaces on Linux
        run: |
          .local/enderpin -C servers/proxy sync --target server --locked
          .local/enderpin -C servers/survival sync --target server --locked
      - name: Verify the locked performance client profile on Linux
        run: .local/enderpin -C clients/performance sync --target client --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enderpin-linux-x86_64
          path: |
            .local/enderpin
            .local/enderpin.sha256
          include-hidden-files: true
          if-no-files-found: error
