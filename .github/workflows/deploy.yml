name: Deploy Minecraft
on:
  workflow_run:
    workflows: [Check configuration and deployment artifact]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: minecraft-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: enderpin-linux-x86_64
          path: .local
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: enderpin-linux-arm64
          path: .local/arm64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the build from this commit
        working-directory: .local
        run: |
          sha256sum -c enderpin.sha256
          chmod 700 enderpin
          (cd arm64 && sha256sum -c enderpin.sha256)
          mv arm64/enderpin enderpin-arm64
          chmod 700 enderpin-arm64
      - name: Install deployment tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r deploy/ansible/requirements.txt
      - name: Prepare private SSH access
        env:
          ENDERPIN_SSH_KEY: ${{ secrets.ENDERPIN_SSH_KEY }}
          ENDERPIN_SSH_KNOWN_HOSTS: ${{ secrets.ENDERPIN_SSH_KNOWN_HOSTS }}
          ENDERPIN_INVENTORY: ${{ secrets.ENDERPIN_INVENTORY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$ENDERPIN_SSH_KEY" > "$HOME/.ssh/enderpin"
          printf '%s\n' "$ENDERPIN_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'SSH'
          Host *
            IdentityFile ~/.ssh/enderpin
            IdentityAgent none
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSH
          python3 - <<'PY'
          import os, re
          private = os.environ['ENDERPIN_INVENTORY'] + os.environ['ENDERPIN_SSH_KNOWN_HOSTS']
          for address in set(re.findall(r'\b(?:\d{1,3}\.){3}\d{1,3}\b', private)):
              print('::add-mask::' + address)
          PY
      - name: Back up and deploy the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          ENDERPIN_REVISION: ${{ github.event.workflow_run.head_sha }}
          ENDERPIN_INVENTORY: ${{ secrets.ENDERPIN_INVENTORY }}
          ENDERPIN_VAULT: ${{ secrets.ENDERPIN_VAULT }}
          ENDERPIN_VAULT_PASSWORD: ${{ secrets.ENDERPIN_VAULT_PASSWORD }}
          HACKCLUB_CDN_API_KEY: ${{ secrets.HACKCLUB_CDN_API_KEY }}
          ENDERPIN_BACKUP_AGE_RECIPIENT: ${{ secrets.ENDERPIN_BACKUP_AGE_RECIPIENT }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$ENDERPIN_REVISION" ]; then
            echo 'A newer commit is on main; skipping this deployment.'
            exit 0
          fi
          .venv/bin/python deploy/cd.py
      - name: Remove deployment credentials
        if: always()
        run: rm -f "$HOME/.ssh/enderpin" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
