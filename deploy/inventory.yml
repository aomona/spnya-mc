all:
  vars:
    enderpin_root: /srv/enderpin
    enderpin_binary: "{{ inventory_dir }}/../.local/enderpin"
    enderpin_accept_eula: true
    enderpin_proxy_address: 10.77.0.1
    enderpin_backend_interface: epvpn
    enderpin_backends:
      survival: 10.77.0.2:25566
    enderpin_try: [survival]
  children:
    minecraft:
      hosts:
        home:
          ansible_host: 192.168.0.10
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/enderpin_ed25519
          ansible_ssh_common_args: -o IdentityAgent=none -o IdentitiesOnly=yes
          enderpin_instances:
            - name: survival
              workspace: servers/survival
              address: 10.77.0.2
              port: 25566
              memory_mib: 2048
              properties:
                motd: Spnya Survival
                max-players: 10
                view-distance: 6
                simulation-distance: 4
                difficulty: normal
        edge:
          ansible_host: 161.33.14.67
          ansible_user: ubuntu
          enderpin_instances:
            - name: proxy
              workspace: servers/proxy
              address: 0.0.0.0
              port: 25565
              memory_mib: 256
              motd: Spnya Minecraft
              show_max_players: 10
    vpn_gateway:
      hosts:
        edge: {}
    vpn_clients:
      hosts:
        home: {}
