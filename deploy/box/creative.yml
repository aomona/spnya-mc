# The creative backend on the manually operated box. Mirrors host_vars/home.yml except for game mode.
# The bind address comes from the ignored local.yml so that no connection address is committed.
name: creative
workspace: servers/creative
port: 25566
voicechat_port: 24454
memory_mib: 2048
properties:
  motd: Spnya Creative
  max-players: 10
  view-distance: 6
  simulation-distance: 4
  difficulty: normal
  gamemode: creative
  force-gamemode: true
  white-list: false
  enforce-whitelist: false
  # The box cannot reach Mojang services for profile keys, so chat on creative is unsigned.
  enforce-secure-profile: false
  # The box VM is occasionally frozen for tens of seconds; resume instead of letting the watchdog crash the server.
  max-tick-time: -1
