enderpin_binary: '{{ playbook_dir }}/../../.local/enderpin-arm64'
# Leave about 2 GiB of usable RAM for the OS, native JVM memory and filesystem cache.
enderpin_disabled_services:
- pmie_check.timer
- pmie_daily.timer
- pmie_farm_check.timer
- pmlogger_check.timer
- pmlogger_daily.timer
- pmlogger_farm_check.timer
- pmie_farm.service
- pmlogger_farm.service
- pmie.service
- pmlogger.service
- pmcd.service
- dtprobed.service
- libstoragemgmt.service
- gssproxy.service
- rpcbind.socket
- rpcbind.service
- iscsid.socket
- iscsid.service
enderpin_instances:
- name: survival
  workspace: .
  address: '{{ enderpin_backend_address }}'
  port: 25566
  voicechat_port: 24454
  memory_mib: 5632
  properties:
    motd: Spnya Survival
    max-players: 10
    view-distance: 6
    simulation-distance: 4
    difficulty: normal
    white-list: false
    enforce-whitelist: false
- name: creative
  workspace: .
  address: '{{ enderpin_backend_address }}'
  port: 25567
  voicechat_port: 24455
  memory_mib: 3072
  properties:
    motd: Spnya Creative
    max-players: 10
    view-distance: 6
    simulation-distance: 4
    difficulty: normal
    gamemode: creative
    level-type: minecraft:flat
    force-gamemode: true
    white-list: false
    enforce-whitelist: false
