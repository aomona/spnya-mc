enderpin_binary: '{{ playbook_dir }}/../../.local/enderpin-arm64'
enderpin_instances:
- name: survival
  workspace: servers/survival
  address: '{{ enderpin_backend_address }}'
  port: 25566
  voicechat_port: 24454
  memory_mib: 4096
  properties:
    motd: Spnya Survival
    max-players: 10
    view-distance: 6
    simulation-distance: 4
    difficulty: normal
    white-list: false
    enforce-whitelist: false
- name: creative
  workspace: servers/creative
  address: '{{ enderpin_backend_address }}'
  port: 25567
  voicechat_port: 24455
  memory_mib: 3072
  properties:
    motd: Spnya Creative
    max-players: 10
    view-distance: 6
    simulation-distance: 4
    difficulty: normal
    gamemode: creative
    level-type: minecraft:flat
    force-gamemode: true
    white-list: false
    enforce-whitelist: false
