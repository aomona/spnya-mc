- name: Read and validate the source workspace
  ansible.builtin.set_fact:
    source: "{{ enderpin_source_root | enderpin_workspace(instance.workspace) }}"
    instance_root: "{{ enderpin_root }}/{{ instance.name }}"
    instance_user: "ep_{{ instance.name }}"
    cutover: false
    staged: {}
    bundle: {}
- name: Validate authentication, bind address, and property lines
  ansible.builtin.assert:
    that:
      - source.runtime == 'velocity' or enderpin_accept_eula | bool
      - source.runtime == 'velocity' or instance.address not in ['0.0.0.0', '255.255.255.255']
      - source.runtime != 'velocity' or enderpin_backends | length > 0
      - source.runtime != 'velocity' or enderpin_try | length > 0
      - source.runtime != 'velocity' or enderpin_try | difference(enderpin_backends.keys() | list) | length == 0
      - instance.bedrock_port is not defined or source.runtime == 'velocity'
- name: Require Discord credentials before enabling proxy authentication
  ansible.builtin.assert:
    that:
      - enderpin_discord_token | default('') | trim | length > 0
      - enderpin_discord_channel_id | default('') is match('^[0-9]{17,20}$')
    fail_msg: Configure the Discord bot token and channel ID before deploying the proxy.
  when: source.runtime == 'velocity'
  no_log: true
- name: Render the effective configuration on the controller
  ansible.builtin.set_fact:
    deployment_service: "{{ lookup('ansible.builtin.template', 'templates/enderpin.service.j2') }}"
    deployment_files: >-
      {{
        {'files/server/velocity.toml': lookup('ansible.builtin.template', 'templates/velocity.toml.j2'),
         'files/server/forwarding.secret': enderpin_forwarding_secret,
         'files/server/plugins/discordintegrationvelocity/config.json':
           lookup('ansible.builtin.template', 'templates/discordintegrationvelocity.json.j2')}
        if source.runtime == 'velocity' else
        {'files/server/server.properties': lookup('ansible.builtin.template', 'templates/server.properties.j2'),
         'files/server/config/' + ('FabricProxy-Lite.toml' if source.runtime == 'fabric' else 'paper-global.yml'):
           lookup('ansible.builtin.template', 'templates/' + ('FabricProxy-Lite.toml' if source.runtime == 'fabric' else 'paper-global.yml') + '.j2')}
        | combine({'files/server/spigot.yml': {'settings': {'bungeecord': false}} | to_nice_yaml} if source.runtime == 'paper' else {})
      }}
  no_log: true
- name: Render voice chat settings for the configured instances
  ansible.builtin.set_fact:
    deployment_files: >-
      {{ deployment_files | combine({
        ('files/server/plugins/voicechat/voicechat-proxy.properties' if source.runtime == 'velocity' else
         'files/server/config/voicechat/voicechat-server.properties'):
        lookup('ansible.builtin.template', 'templates/voicechat-' + ('proxy' if source.runtime == 'velocity' else 'server') + '.properties.j2')}) }}
  when: instance.voicechat_port is defined
  no_log: true
- name: Render the Bedrock entry point on Velocity
  ansible.builtin.set_fact:
    deployment_files: "{{ deployment_files | combine({'files/server/plugins/Geyser-Velocity/config.yml': lookup('ansible.builtin.template', 'templates/geyser.yml.j2'), 'files/server/plugins/floodgate/config.yml': lookup('ansible.builtin.template', 'templates/floodgate.yml.j2')}) }}"
  when: instance.bedrock_port is defined
  no_log: true
- name: Hash the effective inputs independently of the Git revision
  ansible.builtin.set_fact:
    deployment_fingerprint: "{{ source | enderpin_fingerprint(enderpin_binary, deployment_files, deployment_service) }}"
  no_log: true
- name: Check for a previously successful deployment
  ansible.builtin.stat:
    path: "{{ instance_root }}/.deployment-sha256"
    get_checksum: false
  register: deployment_marker
- name: Read the previous successful deployment fingerprint
  ansible.builtin.slurp:
    src: "{{ instance_root }}/.deployment-sha256"
  when: deployment_marker.stat.exists
  register: previous_deployment
  no_log: true
- name: Deploy only instances whose effective inputs changed
  ansible.builtin.include_tasks: apply.yml
  when: (previous_deployment.content | default('') | b64decode | trim) != deployment_fingerprint
- name: Report unchanged instances
  ansible.builtin.debug:
    msg: "{{ instance.name }}: inputs unchanged; skipping transfer, backup, and restart."
  when: (previous_deployment.content | default('') | b64decode | trim) == deployment_fingerprint
