all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    ansible_user: deploy
    enderpin_root: /srv/enderpin
    # A reviewed binary on the Ansible controller; override per host for ARM64.
    enderpin_binary: /opt/enderpin/bin/linux-x86_64/enderpin
    enderpin_accept_eula: false # Set true only after reviewing the Minecraft EULA.
    enderpin_proxy_address: 192.0.2.1
    enderpin_backend_interface: epvpn
    enderpin_backends:
      lobby: 192.0.2.2:25566
      survival: 192.0.2.2:25567
    enderpin_try: [lobby]
    enderpin_vpn:
      endpoint: vpn.example.com
      port: 1194
      network: 192.0.2.0/24
      server_address: 192.0.2.1
    enderpin_vpn_clients:
      home: 192.0.2.2
    # Optional TCP gateway for certificate-only clients without UDP egress (for example behind an HTTP proxy).
    enderpin_vpn_tcp:
      port: 443
      network: 198.51.100.0/29
      server_address: 198.51.100.1
    enderpin_vpn_tcp_clients:
      box: 198.51.100.2
    # Keep this directory on the controller, outside a disposable CI checkout.
    enderpin_pki_directory: /var/lib/enderpin-vpn-pki
  children:
    minecraft:
      hosts:
        home:
          ansible_host: 192.0.2.2
          ansible_ssh_common_args: '-o ProxyJump=deploy@vpn.example.com'
          enderpin_instances:
            - name: lobby
              workspace: servers/lobby
              address: 192.0.2.2
              port: 25566
              memory_mib: 1024
              properties: {view-distance: 6, simulation-distance: 4}
            - name: survival
              workspace: servers/survival
              address: 192.0.2.2
              port: 25567
              memory_mib: 1536
        edge:
          ansible_host: vpn.example.com
          enderpin_instances:
            - name: proxy
              workspace: servers/proxy
              address: 0.0.0.0
              port: 25565
              memory_mib: 512
    vpn_gateway:
      hosts:
        edge: {}
    vpn_clients:
      hosts:
        home: {}
