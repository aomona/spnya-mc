enderpin_root: /srv/enderpin
enderpin_accept_eula: true
enderpin_backend_interface: epvpn
enderpin_try:
- survival
enderpin_binary: '{{ playbook_dir }}/../../.local/enderpin'
# creative runs on a manually operated machine over the TCP VPN; add it only once its address is in the inventory.
enderpin_backends: >-
  {{ {'survival': enderpin_backend_address ~ ':25566'}
     | combine({'creative': enderpin_creative_address ~ ':25566'} if enderpin_creative_address is defined else {}) }}
