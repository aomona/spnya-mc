enderpin_root: /srv/enderpin
enderpin_accept_eula: true
enderpin_backend_interface: epvpn
enderpin_try:
- survival
enderpin_binary: '{{ playbook_dir }}/../../.local/enderpin'
# Add creative to Velocity when its address is configured; its port defaults to the legacy box value.
enderpin_backends: >-
  {{ {'survival': enderpin_backend_address ~ ':25566'}
     | combine({'creative': enderpin_creative_address ~ ':' ~ (enderpin_creative_port | default(25566) | string)} if enderpin_creative_address is defined else {}) }}
