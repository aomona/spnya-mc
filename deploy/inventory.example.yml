# Documentation addresses only. Copy to ignored inventory.yml and replace locally.
all:
  vars:
    enderpin_proxy_address: 192.0.2.1
    enderpin_backend_address: 192.0.2.2
    # Optional: the creative backend on the box, reached over the TCP VPN (see docs/deployment.md).
    # enderpin_vpn_tcp: {port: 443, network: 198.51.100.0/29, server_address: 198.51.100.1}
    # enderpin_vpn_tcp_clients: {box: 198.51.100.2}
    # enderpin_creative_address: 198.51.100.2
  children:
    minecraft:
      hosts:
        home:
          ansible_host: "{{ enderpin_backend_address }}"
          ansible_user: root
          ansible_ssh_common_args: -o ProxyJump=ubuntu@vps.example.com
        edge:
          ansible_host: vps.example.com
          ansible_user: ubuntu
    vpn_gateway:
      hosts:
        edge: {}
    vpn_clients:
      hosts:
        home: {}
