# Documentation addresses only. Copy to ignored inventory.yml and replace locally.
all:
  vars:
    enderpin_proxy_address: 192.0.2.1
    enderpin_backend_address: 192.0.2.2
    enderpin_creative_address: 192.0.2.2
    enderpin_creative_port: 25567
    enderpin_vpn:
      endpoint: 203.0.113.1
      port: 1194
      network: 192.0.2.0/29
      server_address: 192.0.2.1
    enderpin_vpn_clients:
      arm: 192.0.2.2
    enderpin_pki_directory: /var/lib/enderpin-vpn-pki
    # Optional legacy TCP VPN for a separately operated creative box.
    # enderpin_vpn_tcp: {port: 443, network: 198.51.100.0/29, server_address: 198.51.100.1}
    # enderpin_vpn_tcp_clients: {box: 198.51.100.2}
  children:
    minecraft:
      hosts:
        arm:
          ansible_host: 203.0.113.2
          ansible_user: opc
        edge:
          ansible_host: 203.0.113.1
          ansible_user: ubuntu
    vpn_gateway:
      hosts:
        edge: {}
    vpn_clients:
      hosts:
        arm: {}
