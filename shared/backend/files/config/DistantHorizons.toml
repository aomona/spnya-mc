_version = 5

[common.multiThreading]
# The home server has two cores; leave time for Minecraft and other services.
numberOfThreads = 1
threadRunTimeRatio = "0.5"

[common.worldGenerator]
generatorPlan = "CHUNKS_ONLY"
chunkGeneratorMode = "INTERNAL_SERVER"
limitIfServerUnhealthy = true
generationProgressDisplayIntervalInSeconds = 30
