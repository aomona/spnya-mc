# One locked workspace for the client, Fabric backends and Velocity proxy.
format = 4
minecraft = "26.3"

[profiles.backend]
type = "server"
loader = "fabric"
loader_version = "0.19.5"
jvm_args = ["-XX:+UseZGC"]
groups = ["common", "backend"]
file_groups = ["backend"]

[targets.client]
type = "client"
loader = "fabric"
loader_version = "0.19.5"
jvm_args = ["-XX:+UseZGC"]
groups = ["common"]

[targets.survival]
profile = "backend"

[targets.creative]
profile = "backend"

[targets.proxy]
type = "proxy"
loader = "velocity"
loader_version = "4.2.0+30"


